packages:
  - lib
  - stacks/*

# The generated @pulumi/netbird SDK pins an old typescript from Pulumi's
# own codegen default. This keeps one version resolved workspace-wide.
overrides:
  typescript: 6.0.3

allowBuilds:
  '@pulumi/command': true
  '@pulumi/kubernetes': true
  '@pulumi/netbird': true
  '@pulumi/netbird@file:stacks/apps/sdks/netbird': true
  '@pulumi/netbird@file:stacks/platform/sdks/netbird': true
  protobufjs: true
