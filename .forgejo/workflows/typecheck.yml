name: typecheck

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: pnpm install --frozen-lockfile
      - run: |
          for pkg in homelab-lib homelab-apps homelab-platform homelab-talos homelab-vps; do
            echo "::group::tsc --noEmit ($pkg)"
            pnpm --filter "$pkg" exec tsc --noEmit
            echo "::endgroup::"
          done
