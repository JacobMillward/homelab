name: renovate

on:
  # Forgejo shifts DST differently to GitHub, so keep this clear of 01:00-02:00.
  schedule:
    - cron: "0 6 * * *"
      timezone: Europe/London
  push:
    branches: [main]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

jobs:
  renovate:
    runs-on: self-hosted
    env:
      # This job holds a repo-write token, and only the lockfile matters here.
      npm_config_ignore_scripts: "true"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://git.millward-yuan.net/api/v1
      RENOVATE_AUTODISCOVER: "false"
      RENOVATE_REPOSITORIES: jacob/homelab
      RENOVATE_ONBOARDING: "false"
      RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/generate-netbird-sdk\\.sh$"]'
    steps:
      - run: renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          RENOVATE_HOST_RULES: ${{ secrets.RENOVATE_HOST_RULES }}
