name: typecheck

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          for pkg in lib stacks/apps stacks/platform stacks/talos stacks/vps; do
            echo "::group::tsc --noEmit ($pkg)"
            (cd "$pkg" && pnpm exec tsc --noEmit)
            echo "::endgroup::"
          done
