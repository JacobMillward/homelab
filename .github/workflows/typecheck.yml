name: typecheck

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          for pkg in homelab-lib homelab-apps homelab-platform homelab-talos homelab-vps; do
            echo "::group::tsc --noEmit ($pkg)"
            pnpm --filter "$pkg" exec tsc --noEmit
            echo "::endgroup::"
          done
